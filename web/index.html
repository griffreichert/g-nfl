<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>no-homers</title>
    <script>
      // Resolve the theme before first paint so the page never flashes the wrong one.
      (() => {
        const stored = localStorage.getItem('theme')
        // Dark is the product default; only an explicit 'light' or a 'system'
        // preference resolving light ever paints light.
        const dark =
          stored !== 'light' &&
          (stored !== 'system' || matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.add(dark ? 'dark' : 'light')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
